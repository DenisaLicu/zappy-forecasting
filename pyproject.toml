[project]
name = "zappy-forecasting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "joblib>=1.6.0",
    "mlflow>=3.5.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydantic>=2.0.0",
    "prometheus-client>=0.20.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.30.0",
]

[project.scripts]
zappy-forecasting = "zappy_forecasting:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
]
